<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Campaign default image</title>
  <desc id="desc">Default placeholder for campaigns without image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f1d12"/>
      <stop offset="55%" stop-color="#4a2f1d"/>
      <stop offset="100%" stop-color="#6b4528"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#caa679" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#caa679" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g fill="none" stroke="#cfae84" stroke-width="8" stroke-opacity="0.45">
    <path d="M220 520 L420 220 L620 520 Z"/>
    <path d="M660 520 L860 260 L1060 520 Z"/>
  </g>

  <g fill="#f3e2c7" fill-opacity="0.85" text-anchor="middle">
    <text x="640" y="340" font-size="52" font-family="Alegreya, serif" letter-spacing="4">CAMPAIGN</text>
    <text x="640" y="402" font-size="30" font-family="Alegreya, serif" letter-spacing="6">NO IMAGE</text>
  </g>
</svg>
